[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-creator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.20.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/motor_creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
