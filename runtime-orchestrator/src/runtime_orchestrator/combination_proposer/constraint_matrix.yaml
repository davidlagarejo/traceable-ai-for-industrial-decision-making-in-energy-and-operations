# Pattern × Context-Dimension constraint matrix (V10 P4 Strategy 3)
#
# Cada entrada conecta un pattern con un dominio de contexto (mes/clima/
# ocupación) y declara cuándo el pattern dispara un "constraint event":
# una situación que el framework debe detectar para evitar decisiones
# transcendentales mal-timing (e.g., HVAC en julio con alta ocupación).
#
# Phase 0: este es contenido CURADO por humanos (los predicados vienen
# de regulaciones literal: ASHRAE 55 = 73-79°F, OSHA 1910.1000 = heat
# stress, NFPA 70E = electrical work). No es decisión del LLM.
#
# Formato:
#   patterns:
#     <pattern_id>:
#       constraints:
#         - id: <short_name>
#           dimension: <month|climate|occupancy|production_run|...>
#           when:
#             - {field: <facility_prior_field>, op: <eq|in|ge|le|between>, value: ...}
#           decision_implication:
#             action: DEFER_TO_WINDOW | BLOCK_COMPLIANCE | INVESTIGATE_FIRST |
#                     ALTERNATIVE_VIABLE | URGENT_COMPLIANCE
#             allowed_windows: [...]  (optional)
#             note: <text>
#           evidence_anchors:
#             - {citation: <reg or chunk>, verbatim: <text>}
#           consequence_if_ignored:
#             - <text>
#           hypothesis_template: <verbatim quote from evidence_anchors>
#
# IMPORTANTE: hypothesis_template debe ser CITA VERBATIM de evidence_anchors.
# NO inventar. Si no hay cita disponible, dejar vacío y la combination no
# se genera (mejor que generar texto inventado).

patterns:

  # ──────────────────────────────────────────────────────────────────
  # HVAC replacement durante peak summer (tu ejemplo)
  # ──────────────────────────────────────────────────────────────────
  hvac_aging_high_load:
    constraints:
      - id: summer_peak_replacement_violation
        dimension: month + climate + occupancy
        when:
          all:
            - {field: current_month, op: in, value: [6, 7, 8]}
            - {field: climate_zone, op: in, value: ["1A","1B","2A","2B","3A","3B"]}
            - {field: occupancy_density, op: ge, value: 0.5}
        decision_implication:
          action: DEFER_TO_WINDOW
          allowed_windows: [Sep, Oct, Nov, Mar, Apr, May]
          alternative: provide_temporary_cooling_capacity_ge_design_load
          note: "Reemplazo HVAC durante peak cooling season viola confort térmico ASHRAE 55 + dispara riesgo OSHA heat stress."
        evidence_anchors:
          - citation: ashrae_55
            verbatim: "Operative temperature ranges to maintain occupant comfort: 73-79°F (summer cooling season)"
          - citation: "29 cfr 1910.1000"
            verbatim: "OSHA general duty clause requires protection from recognized heat-related hazards"
        consequence_if_ignored:
          - Indoor temperatures pueden exceder 90°F durante el reemplazo
          - ASHRAE 55 violation en operating logs
          - Posible cita OSHA bajo general duty clause si hay heat illness
          - Pérdida de productividad por confort degradado
        hypothesis_template: '"Operative temperature ranges to maintain occupant comfort: 73-79°F (summer cooling season)" [ashrae_55]'

      - id: winter_peak_replacement_violation
        dimension: month + climate + occupancy
        when:
          all:
            - {field: current_month, op: in, value: [12, 1, 2]}
            - {field: climate_zone, op: in, value: ["5A","5B","6A","6B","7","8"]}
            - {field: occupancy_density, op: ge, value: 0.5}
        decision_implication:
          action: DEFER_TO_WINDOW
          allowed_windows: [Apr, May, Sep, Oct]
          alternative: provide_temporary_heating_capacity_ge_design_load
          note: "Reemplazo HVAC durante peak heating en clima frío viola ASHRAE 55 + posible exposición OSHA cold."
        evidence_anchors:
          - citation: ashrae_55
            verbatim: "Operative temperature ranges to maintain occupant comfort: 68-74°F (winter heating season)"
        consequence_if_ignored:
          - Indoor temperatures pueden caer bajo 65°F durante el reemplazo
          - Pérdida de productividad y posible exposición a cold stress
        hypothesis_template: '"Operative temperature ranges to maintain occupant comfort: 68-74°F (winter heating season)" [ashrae_55]'

  # ──────────────────────────────────────────────────────────────────
  # Cold chain — shutdowns durante peak operativo
  # ──────────────────────────────────────────────────────────────────
  refrigerant_integrity:
    constraints:
      - id: cold_chain_peak_season_shutdown
        dimension: month + cold_chain_season + inventory
        when:
          all:
            - {field: asset_family, op: eq, value: cold_chain_facility}
            - {field: current_month, op: in, value: [11, 12, 1]}  # peak storage season
            - {field: inventory_utilization, op: ge, value: 0.7}
        decision_implication:
          action: DEFER_TO_WINDOW
          allowed_windows: [Mar, Apr, May, Jun, Sep, Oct]
          alternative: rent_alternative_cold_storage_capacity
          note: "Reparación de refrigeración mayor durante peak holiday/inventory season → pérdidas de producto."
        evidence_anchors:
          - citation: "40 cfr 82"
            verbatim: "The owner or operator of refrigeration equipment with a charge of more than 50 lbs of refrigerant must repair leaks"
        consequence_if_ignored:
          - Pérdidas catastróficas de inventario perecedero
          - Insurance claims expuestas
          - Disrupción supply-chain del cliente
        hypothesis_template: '"The owner or operator of refrigeration equipment with a charge of more than 50 lbs of refrigerant must repair leaks" [40 cfr 82]'

  # ──────────────────────────────────────────────────────────────────
  # Electrical work durante producción activa
  # ──────────────────────────────────────────────────────────────────
  reactive_power_exposure:
    constraints:
      - id: electrical_shutdown_during_production_run
        dimension: production_run + safety
        when:
          all:
            - {field: production_active, op: eq, value: true}
        decision_implication:
          action: DEFER_TO_WINDOW
          allowed_windows: [scheduled_maintenance_window, weekend, holiday]
          alternative: schedule_PM_window_with_advance_notice
          note: "Electrical work durante run requiere LOTO completo (NFPA 70E) — si no se planea, riesgo arc flash + producción detenida no planificada."
        evidence_anchors:
          - citation: "nfpa 70e"
            verbatim: "Establishment of an electrically safe work condition shall include lockout/tagout procedures"
        consequence_if_ignored:
          - Arc flash incidents possible (NFPA 70E violation)
          - Unplanned production downtime
          - Posible muerte/lesión seria si LOTO falla
        hypothesis_template: '"Establishment of an electrically safe work condition shall include lockout/tagout procedures" [nfpa 70e]'

  # ──────────────────────────────────────────────────────────────────
  # Boiler retrofits durante temporada de calefacción
  # ──────────────────────────────────────────────────────────────────
  boiler_degradation_plausibility:
    constraints:
      - id: boiler_retrofit_during_heating_season
        dimension: month + climate
        when:
          all:
            - {field: current_month, op: in, value: [11, 12, 1, 2, 3]}
            - {field: climate_zone, op: in, value: ["4A","4B","4C","5A","5B","6A","6B","7","8"]}
        decision_implication:
          action: DEFER_TO_WINDOW
          allowed_windows: [May, Jun, Jul, Aug, Sep]
          alternative: temporary_boiler_or_electric_resistance_backup
          note: "Retrofit de boiler durante heating season en clima frío deja el facility sin calefacción."
        evidence_anchors:
          - citation: ashrae_90.1
            verbatim: "Heating systems shall maintain indoor design temperature of 68°F minimum during occupied hours"
        consequence_if_ignored:
          - Pérdida de calefacción durante retrofit
          - Productividad degradada
          - Posible damage por congelamiento de tuberías
        hypothesis_template: '"Heating systems shall maintain indoor design temperature of 68°F minimum during occupied hours" [ashrae_90.1]'

  # ──────────────────────────────────────────────────────────────────
  # Compressed air system shutdown durante run continuo
  # ──────────────────────────────────────────────────────────────────
  compressed_air_leak_plausibility:
    constraints:
      - id: compressed_air_repair_during_continuous_run
        dimension: production_run
        when:
          all:
            - {field: production_pattern, op: eq, value: continuous_24_7}
        decision_implication:
          action: ALTERNATIVE_VIABLE
          alternative: install_redundant_compressor_first_then_repair
          note: "Reparación de compressed air durante operación continua requiere capacidad redundante — sin ella, todo el plant para."
        evidence_anchors:
          - citation: doe_amo
            verbatim: "Compressed air system audits should be performed during scheduled downtime to avoid production disruption"
        consequence_if_ignored:
          - Detención total del plant
          - Pérdidas significativas de producción
          - Stress térmico en compresores activos cubriendo demanda
        hypothesis_template: '"Compressed air system audits should be performed during scheduled downtime to avoid production disruption" [doe_amo]'

# ──────────────────────────────────────────────────────────────────────
# CONTEXTO ADICIONAL — campos esperados de facility_prior/real_discovery
# ──────────────────────────────────────────────────────────────────────
# El predicate_evaluator (Fase A.7) busca estos campos en este orden:
#   - facility_prior.target_definition.{climate_zone, occupancy_density, ...}
#   - real_discovery_bundle.enriched_context.{climate_zone, lat, lon, ...}
#   - real_discovery_bundle.results.noaa_climate.payload.{...}
#   - real_discovery_bundle.results.epa_envirofacts.payload.{...}
#   - facility_inputs.{...}
# Si no encuentra el campo → la combination NO se activa (es lo correcto:
# sin datos del contexto no podemos afirmar el predicado).
