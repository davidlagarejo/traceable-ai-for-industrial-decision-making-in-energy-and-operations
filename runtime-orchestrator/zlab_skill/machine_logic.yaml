scope:
  - Rotating equipment (motors, drives, fans, pumps, compressors)
  - Process equipment (boilers, chillers, presses, ovens, mixers)
  - Part-load behavior and staging logic
  - Maintenance reality (degradation pathways, false-assumption traps)
governing_principles:
  - Equipment efficiency is part-load dependent; rated efficiency is rarely the operating efficiency
  - Sequencing/staging is a controls-grade lever; CAPEX-first logic frequently masks a controls fix
  - Degradation accumulates silently between maintenance events; absence of alarm is not absence of loss
notes:
  - Machine logic patterns must always declare anti_triggers (when the pattern does NOT apply) and falsification conditions
  - Tier-1 source citation required for any kWh/ton-hour or kWh/MMBtu claim
